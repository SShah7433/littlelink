<!DOCTYPE html>

<html class="theme-dark" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Race status | Sidd Shah</title>
    <meta name="description" content="Live race tracking status for Sidd Shah.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/brands.css">
    <style>
      .race-page {
        min-height: 100dvh;
        background:
          radial-gradient(circle at top, rgba(0, 124, 195, 0.24), transparent 34rem),
          #343434;
      }

      .race-shell {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 2rem 1.25rem;
      }

      .race-card {
        width: min(100%, 31rem);
        padding: clamp(2rem, 7vw, 3.5rem);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 1.5rem;
        background: rgba(52, 52, 52, 0.78);
        box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.28);
        text-align: center;
      }

      .race-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        padding: 0.45rem 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        color: #dceeff;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .race-badge-dot,
      .refresh-dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: #4899f7;
        box-shadow: 0 0 0 0.25rem rgba(72, 153, 247, 0.16);
      }

      .race-avatar {
        width: 5.5rem;
        height: 5.5rem;
        margin-bottom: 1.5rem;
        border: 3px solid rgba(72, 153, 247, 0.65);
        border-radius: 50%;
        box-shadow: 0 0 0 0.5rem rgba(72, 153, 247, 0.1);
      }

      .race-card h1 {
        margin-bottom: 1rem;
        font-size: clamp(2.25rem, 7vw, 3.3rem);
      }

      .race-message {
        max-width: 25rem;
        margin: 0 auto 1.5rem;
        color: rgba(255, 255, 255, 0.78);
      }

      .refresh-status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        margin: 0 auto 1.75rem;
        color: #dceeff;
        font-size: 0.95rem;
      }

      .refresh-button {
        width: min(100%, 18.75rem);
        margin: 0;
        border-radius: 0.75rem;
        box-shadow: 0 0.75rem 1.5rem rgba(0, 124, 195, 0.24);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .refresh-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 1rem 2rem rgba(0, 124, 195, 0.34);
      }

      .back-home-button {
        margin: 1rem 0 0;
        border-radius: 0.75rem;
        --button-text: #dceeff;
        --button-background: rgba(255, 255, 255, 0.1);
        --button-border: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .refresh-button {
          transition: none;
        }
      }

      html.page-fits-viewport,
      html.page-fits-viewport body {
        overflow: hidden;
      }
    </style>
  </head>

  <body class="race-page">
    <main class="race-shell">
      <section class="race-card" aria-labelledby="race-status-heading">
        <div class="race-badge"><span class="race-badge-dot" aria-hidden="true"></span>Live race tracking</div>
        <img class="avatar race-avatar" src="/images/avatar.jpg" alt="Sidd Shah">
        <h1 id="race-status-heading">Race has not started</h1>
        <p class="race-message">
          This page will automatically redirect to Garmin LiveTrack when it becomes available.
        </p>
        <p id="refresh-status" class="refresh-status" aria-live="off">
          <span class="refresh-dot" aria-hidden="true"></span>Checking again in 60 seconds
        </p>
        <button id="refresh-button" class="button button-garmin refresh-button" type="button">
          Refresh now
        </button>
        <a class="button back-home-button" href="/">Go back to home</a>
      </section>
    </main>

    <script>
      function updateViewportScroll() {
        const root = document.documentElement;
        const shell = document.querySelector(".race-shell");
        const card = document.querySelector(".race-card");
        root.classList.remove("page-fits-viewport");

        const shellStyles = window.getComputedStyle(shell);
        const requiredHeight =
          card.getBoundingClientRect().height +
          Number.parseFloat(shellStyles.paddingTop) +
          Number.parseFloat(shellStyles.paddingBottom);
        const viewportHeight = window.visualViewport?.height ?? window.innerHeight;

        root.classList.toggle("page-fits-viewport", requiredHeight <= viewportHeight + 1);
      }

      window.addEventListener("resize", updateViewportScroll);
      window.visualViewport?.addEventListener("resize", updateViewportScroll);
      window.addEventListener("load", updateViewportScroll);
      document.fonts?.ready.then(updateViewportScroll);
      requestAnimationFrame(updateViewportScroll);

      const refreshIntervalMs = 60_000;
      const requestTimeoutMs = 15_000;
      const raceStatusEndpoint = "/api/race-status";
      const status = document.getElementById("refresh-status");
      const refreshButton = document.getElementById("refresh-button");
      const startedAt = Date.now();
      let nextCheckAt = startedAt + refreshIntervalMs;
      let refreshTimer;
      let checkInProgress = false;

      function setStatus(message) {
        status.innerHTML = `<span class="refresh-dot" aria-hidden="true"></span>${message}`;
      }

      function updateStatus() {
        const remainingSeconds = Math.max(0, Math.ceil((nextCheckAt - Date.now()) / 1000));
        setStatus(`Checking again in ${remainingSeconds} second${remainingSeconds === 1 ? "" : "s"}`);
      }

      async function checkForLiveTrack() {
        if (checkInProgress) {
          return;
        }

        checkInProgress = true;
        refreshButton.disabled = true;
        refreshButton.textContent = "Checking…";
        const controller = new AbortController();
        const requestTimeout = window.setTimeout(() => controller.abort(), requestTimeoutMs);

        try {
          const response = await fetch(raceStatusEndpoint, {
            cache: "no-store",
            signal: controller.signal,
          });
          if (!response.ok) {
            throw new Error("Unable to check race status");
          }

          const { livetrackUrl } = await response.json();
          if (livetrackUrl) {
            setStatus("Live tracking is ready. Redirecting…");
            window.location.assign(livetrackUrl);
          }
        } catch (error) {
          setStatus("Could not check yet. We'll try again automatically.");
        } finally {
          window.clearTimeout(requestTimeout);
          checkInProgress = false;
          refreshButton.disabled = false;
          refreshButton.textContent = "Refresh now";
        }
      }

      function scheduleNextCheck(delay = refreshIntervalMs) {
        window.clearTimeout(refreshTimer);
        nextCheckAt = Date.now() + delay;
        refreshTimer = window.setTimeout(() => {
          refreshTimer = undefined;
          void runAutomaticCheck();
        }, delay);
      }

      async function runAutomaticCheck() {
        try {
          await checkForLiveTrack();
        } finally {
          scheduleNextCheck();
        }
      }

      refreshButton.addEventListener("click", async () => {
        window.clearTimeout(refreshTimer);
        await checkForLiveTrack();
        scheduleNextCheck();
      });
      updateStatus();
      window.setInterval(updateStatus, 1_000);
      scheduleNextCheck();
    </script>
  </body>
</html>
